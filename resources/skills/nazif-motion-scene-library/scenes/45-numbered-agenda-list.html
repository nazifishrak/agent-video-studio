<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>45 / Numbered Agenda Focus</title>
  <link rel="stylesheet" href="../engine/tokens.css">
  <style>
.hd { font-size:58px; margin-bottom:44px; }
        .list { display:flex; flex-direction:column; gap:20px; }
        .it { padding:28px 36px; display:flex; align-items:center; gap:28px; font-size:34px; font-weight:600; }
        .num { font-size:26px; color:var(--accent-primary); width:48px; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="stage-aurora"></div>
    <div class="scene-root" id="scene-root"></div>
  </div>
  <script src="../engine/motion-engine.js"></script>
  <script>
    const root = document.getElementById('scene-root');
    const el = (id) => document.getElementById(id);
    const { prog, lerp, bootScene } = window.MotionEngine;
    bootScene({
      meta: {"id": "45-numbered-agenda-list", "number": "45", "name": "Numbered Agenda Focus", "category": "Chapters & Pacing", "inspiration": "Keynote / Explainer", "duration": 5.0, "fps": 30, "transparent_ready": false},
      defaultProps: {"title": "How the pipeline works", "items": ["Write a tight 45-second script", "Cut clean A-roll footage", "Generate decoupled motion plates", "Composite and export in 4K"], "activeIdx": 2},
      mount(p) {
root.innerHTML = `<div class="t-display hd">${p.title}</div>
        <div class="list">${p.items.map((x,i)=>`<div class="card it" id="i${i}"><span class="num t-num">0${i+1}</span><span>${x}</span></div>`).join('')}</div>`;
      },
      render(t, p) {
const foc=prog(t,1.3,0.5,'power2.inOut');
        p.items.forEach((_,i)=>{
          const e=prog(t,0.15+i*0.14,0.45,'expo.out');
          const isAct = i===p.activeIdx;
          el('i'+i).style.opacity=e*(isAct?1:lerp(1,0.35,foc));
          el('i'+i).style.transform=`translateX(${lerp(-24,0,e)}px) scale(${isAct?lerp(1,1.02,foc):1})`;
          el('i'+i).style.borderColor=(isAct&&foc>0.3)?'var(--accent-primary)':'var(--border-subtle)';
        });
      }
    });
  </script>
</body>
</html>
