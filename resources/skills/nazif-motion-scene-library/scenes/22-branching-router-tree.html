<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>22 / Branching Router Tree</title>
  <link rel="stylesheet" href="../engine/tokens.css">
  <style>
.wrap { display:grid; grid-template-columns:420px 1fr; gap:90px; align-items:center; }
        .rt { padding:48px; text-align:center; font-size:36px; font-weight:700; border:3px solid var(--accent-primary); }
        .brs { display:flex; flex-direction:column; gap:28px; }
        .br { padding:34px 40px; font-size:30px; font-weight:600; display:flex; justify-content:space-between; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="stage-aurora"></div>
    <div class="scene-root" id="scene-root"></div>
  </div>
  <script src="../engine/motion-engine.js"></script>
  <script>
    const root = document.getElementById('scene-root');
    const el = (id) => document.getElementById(id);
    const { prog, lerp, bootScene } = window.MotionEngine;
    bootScene({
      meta: {"id": "22-branching-router-tree", "number": "22", "name": "Branching Router Tree", "category": "Workflows & Agents", "inspiration": "n8n / Workflows", "duration": 5.2, "fps": 30, "transparent_ready": false},
      defaultProps: {"root": "Incoming Request", "branches": ["High-Intent Lead", "Support Triage", "Auto-Enrich CRM"]},
      mount(p) {
root.innerHTML = `<div class="wrap">
          <div class="card rt" id="rt">${p.root}</div>
          <div class="brs">${p.branches.map((b,i)=>`<div class="card br" id="br${i}"><span>${b}</span><span style="color:var(--accent-primary)">Routed →</span></div>`).join('')}</div>
        </div>`;
      },
      render(t, p) {
const r=prog(t,0.12,0.55,'expo.out'); el('rt').style.opacity=r; el('rt').style.transform=`translateX(${lerp(-40,0,r)}px)`;
        p.branches.forEach((_,i)=>{ const bp=prog(t,0.85+i*0.35,0.55,'expo.out'); el('br'+i).style.opacity=bp; el('br'+i).style.transform=`translateX(${lerp(60,0,bp)}px)`; });
      }
    });
  </script>
</body>
</html>
